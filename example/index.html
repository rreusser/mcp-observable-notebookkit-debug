  <script id="26" type="module" pinned="">
    // Plain SVG created with DOM APIs
    const plainSvg = display((() => {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("width", "200");
      svg.setAttribute("height", "100");
      svg.setAttribute("viewBox", "0 0 200 100");

      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("width", "200");
      rect.setAttribute("height", "100");
      rect.setAttribute("fill", "#10b981");
      svg.appendChild(rect);

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", "100");
      text.setAttribute("y", "55");
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("fill", "white");
      text.setAttribute("font-size", "20");
      text.setAttribute("font-family", "sans-serif");
      text.textContent = "Plain SVG";
      svg.appendChild(text);

      return svg;
    })());
  </script>
  <script id="28" type="module" pinned="">
    // SVG created with d3
    const d3Svg = display((() => {
      const svg = d3.create("svg")
        .attr("width", 200)
        .attr("height", 100)
        .attr("viewBox", "0 0 200 100");

      svg.append("rect")
        .attr("width", 200)
        .attr("height", 100)
        .attr("fill", "#8b5cf6");

      svg.append("text")
        .attr("x", 100)
        .attr("y", 55)
        .attr("text-anchor", "middle")
        .attr("fill", "white")
        .attr("font-size", 20)
        .attr("font-family", "sans-serif")
        .text("D3 SVG");

      return svg.node();
    })());
  </script>

  <!-- Dependency chain examples -->
  <script id="100" type="text/markdown">
    ## Dependency Chain Examples
    The following cells demonstrate various dependency patterns.
  </script>

  <!-- Linear chain: base → derived1 → derived2 → derived3 -->
  <script id="101" type="module" pinned="">
    const chainBase = 10;
  </script>
  <script id="102" type="module" pinned="">
    const chainDerived1 = chainBase * 2;
  </script>
  <script id="103" type="module" pinned="">
    const chainDerived2 = chainDerived1 + 5;
  </script>
  <script id="104" type="module" pinned="">
    const chainDerived3 = chainDerived2 * chainDerived2;
  </script>

  <!-- Diamond pattern: diamondTop → (diamondLeft, diamondRight) → diamondBottom -->
  <script id="110" type="module" pinned="">
    const diamondTop = 100;
  </script>
  <script id="111" type="module" pinned="">
    const diamondLeft = diamondTop / 2;
  </script>
  <script id="112" type="module" pinned="">
    const diamondRight = diamondTop / 4;
  </script>
  <script id="113" type="module" pinned="">
    const diamondBottom = diamondLeft + diamondRight;
  </script>

  <!-- Fan-out: fanSource → (fanA, fanB, fanC, fanD) -->
  <script id="120" type="module" pinned="">
    const fanSource = { x: 1, y: 2, z: 3 };
  </script>
  <script id="121" type="module" pinned="">
    const fanA = fanSource.x;
  </script>
  <script id="122" type="module" pinned="">
    const fanB = fanSource.y;
  </script>
  <script id="123" type="module" pinned="">
    const fanC = fanSource.z;
  </script>
  <script id="124" type="module" pinned="">
    const fanD = fanSource.x + fanSource.y + fanSource.z;
  </script>

  <!-- Fan-in: (inputA, inputB, inputC) → aggregated -->
  <script id="130" type="module" pinned="">
    const inputA = "Hello";
  </script>
  <script id="131" type="module" pinned="">
    const inputB = " ";
  </script>
  <script id="132" type="module" pinned="">
    const inputC = "World";
  </script>
  <script id="133" type="module" pinned="">
    const aggregated = inputA + inputB + inputC;
  </script>

  <!-- Mixed: combines multiple patterns -->
  <script id="140" type="module" pinned="">
    const mixedRoot = 5;
  </script>
  <script id="141" type="module" pinned="">
    const mixedBranch1 = mixedRoot * 2;
  </script>
  <script id="142" type="module" pinned="">
    const mixedBranch2 = mixedRoot * 3;
  </script>
  <script id="143" type="module" pinned="">
    const mixedMerge = mixedBranch1 + mixedBranch2 + chainBase;
  </script>
  <script id="144" type="module" pinned="">
    const mixedFinal = mixedMerge + diamondBottom;
  </script>
