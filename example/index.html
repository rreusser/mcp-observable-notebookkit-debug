  <script id="200" type="text/markdown">
    ## Mouse and Keyboard Interaction Tests
    Interactive elements for testing SendKeys, MouseClick, MouseDrag, and MouseWheel.
  </script>
  <script id="201" type="module">
    const keyboardTest = display((() => {
      const container = document.createElement("div");
      container.id = "keyboard-test";
      container.innerHTML = `
        <div style="margin-bottom: 8px; font-weight: bold;">Keyboard Test</div>
        <input type="text" id="keyboard-input" placeholder="Type here or use SendKeys..."
               style="padding: 8px; width: 300px; border: 1px solid #ccc; border-radius: 4px;" />
        <div id="keyboard-log" style="margin-top: 8px; font-family: monospace; font-size: 12px; color: #666;">
          Last key: (none)
        </div>
      `;
      const input = container.querySelector("#keyboard-input");
      const log = container.querySelector("#keyboard-log");
      input.addEventListener("keydown", (e) => {
        log.textContent = `Last key: ${e.key} (code: ${e.code}, keyCode: ${e.keyCode})`;
      });
      return container;
    })());
  </script>
  <script id="202" type="module">
    const clickTest = display((() => {
      const container = document.createElement("div");
      container.id = "click-test";
      let clickCount = 0;
      container.innerHTML = `
        <div style="margin-bottom: 8px; font-weight: bold;">Mouse Click Test</div>
        <div id="click-target" style="width: 200px; height: 100px; background: #3b82f6; color: white;
             display: flex; align-items: center; justify-content: center; border-radius: 8px;
             cursor: pointer; user-select: none; font-size: 18px;">
          Click me!
        </div>
        <div id="click-log" style="margin-top: 8px; font-family: monospace; font-size: 12px; color: #666;">
          Clicks: 0 | Last position: (-, -)
        </div>
      `;
      const target = container.querySelector("#click-target");
      const log = container.querySelector("#click-log");
      target.addEventListener("click", (e) => {
        clickCount++;
        const rect = target.getBoundingClientRect();
        const relX = Math.round(e.clientX - rect.left);
        const relY = Math.round(e.clientY - rect.top);
        target.textContent = `Clicked ${clickCount}x`;
        log.textContent = `Clicks: ${clickCount} | Last position: (${relX}, ${relY})`;
      });
      return container;
    })());
  </script>
  <script id="203" type="module">
    const dragTest = display((() => {
      const container = document.createElement("div");
      container.id = "drag-test";
      container.innerHTML = `
        <div style="margin-bottom: 8px; font-weight: bold;">Mouse Drag Test</div>
        <div id="drag-area" style="width: 300px; height: 150px; background: #f0f0f0; border: 2px dashed #ccc;
             border-radius: 8px; position: relative; overflow: hidden;">
          <div id="drag-target" style="width: 60px; height: 60px; background: #10b981; border-radius: 8px;
               position: absolute; left: 20px; top: 45px; cursor: grab; display: flex;
               align-items: center; justify-content: center; color: white; font-size: 12px;">
            Drag
          </div>
        </div>
        <div id="drag-log" style="margin-top: 8px; font-family: monospace; font-size: 12px; color: #666;">
          Position: (20, 45) | Dragging: no
        </div>
      `;
      const area = container.querySelector("#drag-area");
      const target = container.querySelector("#drag-target");
      const log = container.querySelector("#drag-log");
      let isDragging = false;
      let startX, startY, startLeft, startTop;

      target.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = target.offsetLeft;
        startTop = target.offsetTop;
        target.style.cursor = "grabbing";
        log.textContent = `Position: (${startLeft}, ${startTop}) | Dragging: yes`;
        e.preventDefault();
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const newLeft = Math.max(0, Math.min(240, startLeft + dx));
        const newTop = Math.max(0, Math.min(90, startTop + dy));
        target.style.left = newLeft + "px";
        target.style.top = newTop + "px";
        log.textContent = `Position: (${newLeft}, ${Math.round(newTop)}) | Dragging: yes`;
      });

      window.addEventListener("mouseup", () => {
        if (isDragging) {
          isDragging = false;
          target.style.cursor = "grab";
          const left = target.offsetLeft;
          const top = target.offsetTop;
          log.textContent = `Position: (${left}, ${top}) | Dragging: no`;
        }
      });

      return container;
    })());
  </script>
  <script id="204" type="module">
    const wheelTest = display((() => {
      const container = document.createElement("div");
      container.id = "wheel-test";
      let scale = 1;
      let totalDeltaY = 0;
      container.innerHTML = `
        <div style="margin-bottom: 8px; font-weight: bold;">Mouse Wheel Test</div>
        <div id="wheel-area" style="width: 200px; height: 100px; background: #8b5cf6; border-radius: 8px;
             display: flex; align-items: center; justify-content: center; overflow: hidden;">
          <div id="wheel-target" style="color: white; font-size: 18px; transition: transform 0.1s;">
            Scroll here
          </div>
        </div>
        <div id="wheel-log" style="margin-top: 8px; font-family: monospace; font-size: 12px; color: #666;">
          Scale: 1.00 | Total deltaY: 0
        </div>
      `;
      const area = container.querySelector("#wheel-area");
      const target = container.querySelector("#wheel-target");
      const log = container.querySelector("#wheel-log");

      area.addEventListener("wheel", (e) => {
        e.preventDefault();
        totalDeltaY += e.deltaY;
        scale = Math.max(0.5, Math.min(2, scale - e.deltaY * 0.001));
        target.style.transform = `scale(${scale})`;
        log.textContent = `Scale: ${scale.toFixed(2)} | Total deltaY: ${Math.round(totalDeltaY)}`;
      });

      return container;
    })());
  </script>
